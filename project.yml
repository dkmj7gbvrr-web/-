name: WarikanKakeibo
options:
  bundleIdPrefix: com.warikankakeibo
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  WarikanKakeibo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WarikanKakeibo/Sources
    resources:
      - path: WarikanKakeibo/Resources
    info:
      path: WarikanKakeibo/Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.warikankakeibo.app
        PRODUCT_NAME: WarikanKakeibo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WarikanKakeiboTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WarikanKakeiboTests
    dependencies:
      - target: WarikanKakeibo
    settings:
      base:
        SWIFT_VERSION: "5.0"
schemes:
  WarikanKakeibo:
    build:
      targets:
        WarikanKakeibo: all
        WarikanKakeiboTests: [test]
    test:
      targets:
        - WarikanKakeiboTests
    run:
      config: Debug
