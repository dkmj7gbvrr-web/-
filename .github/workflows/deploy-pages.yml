name: Deploy Pages

on:
  push:
    branches:
      - main
      - claude/pokefuta-visit-tracker-f4uqq5
      - claude/nanpure-app-dev-u0i5aq
      - claude/test-tube-liquid-game-4trso3
    paths:
      - "pokefuta-visit-tracker/**"
      - "nanpure-app/**"
      - "test-tube-liquid-game/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pokefuta-visit-tracker/package-lock.json
            nanpure-app/package-lock.json
            test-tube-liquid-game/package-lock.json

      - name: Build pokefuta-visit-tracker
        working-directory: pokefuta-visit-tracker
        run: |
          npm ci
          npm run build

      - name: Build nanpure-app
        working-directory: nanpure-app
        run: |
          npm ci
          npm run build

      - name: Build test-tube-liquid-game
        working-directory: test-tube-liquid-game
        run: |
          npm ci
          npm run test
          npm run build

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r pokefuta-visit-tracker/dist/. site/
          mkdir -p site/nanpure-app
          cp -r nanpure-app/dist/. site/nanpure-app/
          mkdir -p site/test-tube-liquid-game
          cp -r test-tube-liquid-game/dist/. site/test-tube-liquid-game/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
