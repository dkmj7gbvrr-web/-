name: Deploy pokefuta-visit-tracker to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/pokefuta-visit-tracker-f4uqq5
    paths:
      - "pokefuta-visit-tracker/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokefuta-visit-tracker/package-lock.json
      - run: npm ci
        working-directory: pokefuta-visit-tracker
      - run: npm run build
        working-directory: pokefuta-visit-tracker
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pokefuta-visit-tracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
